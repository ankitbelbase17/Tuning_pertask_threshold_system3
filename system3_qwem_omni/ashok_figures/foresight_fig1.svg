    <rect x="406" y="256" width="40" height="44" rx="3" fill="#D7E6EF" stroke="#7FA6C0" stroke-width="1.2"/>
    <g stroke="#B4CFE0" stroke-width="0.9">
      <line x1="419" y1="256" x2="419" y2="300"/><line x1="433" y1="256" x2="433" y2="300"/><line x1="406" y1="278" x2="446" y2="278"/>
    </g>

    <rect x="462" y="256" width="40" height="44" rx="3" fill="#FFFFFF" stroke="#B4CFE0" stroke-width="1.2"/>
    <g>
      <rect x="465" y="259" width="10" height="18" fill="#EFF5F9"/>
      <rect x="477" y="259" width="10" height="18" fill="#89B4CE"/>
      <rect x="489" y="259" width="10" height="18" fill="#EFF5F9"/>
      <rect x="465" y="279" width="10" height="18" fill="#89B4CE"/>
      <rect x="477" y="279" width="10" height="18" fill="#EFF5F9"/>
      <rect x="489" y="279" width="10" height="18" fill="#EFF5F9"/>
    </g>

    <rect x="518" y="256" width="40" height="44" rx="3" fill="none" stroke="#D8D2C8" stroke-width="1.2" stroke-dasharray="4,3"/>
  </g>
  <text x="406" y="324" font-size="14" font-style="italic" fill="#9A9289">only what the plan asked for</text>

  <path d="M566,278 L590,278" fill="none" stroke="#9A9289" stroke-width="1.6" marker-end="url(#aGray)"/>

  <!-- ============ ENCODER ============ -->
  <rect x="600" y="246" width="130" height="68" rx="6" fill="#F2EFEA" stroke="#9A9289" stroke-width="1.4"/>
  <text x="665" y="286" font-size="18" fill="#2B2926" text-anchor="middle">Encoder</text>

  <!-- ============ THE CONFIG ============ -->
  <rect x="560" y="86" width="400" height="124" rx="8" fill="#FBEFD8" stroke="#D9902A" stroke-width="2"/>
  <text x="582" y="116" font-size="13" letter-spacing="2.2" fill="#A96C0E">CONFIG</text>
  <g font-family="'DejaVu Sans Mono', 'SF Mono', Menlo, monospace" font-size="15" fill="#4A453F">
    <text x="582" y="146">look:      penalty area</text>
    <text x="582" y="172">sample:    3 fps</text>
    <text x="582" y="198">ask next:  did a goal happen?</text>
  </g>

  <!-- taps : the config sets everything inside -->
  <g stroke="#D9902A" stroke-width="1.8" fill="none" stroke-dasharray="5,4">
    <path d="M596,214 C520,254 434,236 392,252" marker-end="url(#aAmber)"/>
    <path d="M662,214 C663,226 663,232 664,240" marker-end="url(#aAmber)"/>
    <path d="M902,212 C946,222 1006,226 1052,230" marker-end="url(#aAmber)"/>
  </g>

  <!-- ============ THINKING LLM ============ -->
  <rect x="960" y="234" width="230" height="94" rx="8" fill="#FFFFFF" stroke="#2B2926" stroke-width="2.2"/>
  <text x="1075" y="274" font-size="21" font-weight="600" fill="#2B2926" text-anchor="middle">Thinking LLM</text>
  <text x="1075" y="300" font-size="14" font-style="italic" fill="#9A9289" text-anchor="middle">frozen</text>

  <!-- it writes the config -->
  <path d="M1092,232 C1122,188 1044,140 968,146" fill="none" stroke="#D9902A" stroke-width="2.6" marker-end="url(#aAmber)"/>
  <text x="1058" y="176" font-size="15" font-weight="600" fill="#A96C0E">writes</text>

  <!-- ============ RIGHT : RESPONSE ============ -->
  <path d="M1190,282 C1216,284 1230,286 1248,288" fill="none" stroke="#2B2926" stroke-width="2" marker-end="url(#aInk)"/>
  <line x1="1264" y1="242" x2="1264" y2="298" stroke="#C9C2B8" stroke-width="2"/>
  <text x="1278" y="260" font-size="13" letter-spacing="2.2" fill="#9A9289">RESPONSE</text>
  <text x="1278" y="290" font-size="18" fill="#2B2926">0:42 — a goal was scored.</text>
  <text x="1278" y="316" font-size="14" font-style="italic" fill="#9A9289">spoken the moment it matters</text>

  <!-- ============ BELOW / OUTSIDE : INGEST + MEMORY ============ -->

  <path d="M665,316 C665,400 664,460 664,512" fill="none" stroke="#9A9289" stroke-width="1.6" marker-end="url(#aGray)"/>

  <rect x="580" y="520" width="170" height="72" rx="8" fill="#FFFFFF" stroke="#2B2926" stroke-width="1.8"/>
  <text x="665" y="554" font-size="19" font-weight="600" fill="#2B2926" text-anchor="middle">Ingest LLM</text>
  <text x="665" y="576" font-size="13" font-style="italic" fill="#9A9289" text-anchor="middle">frozen</text>

  <path d="M750,556 L806,556" fill="none" stroke="#9A9289" stroke-width="1.6" marker-end="url(#aGray)"/>

  <text x="820" y="522" font-size="13" letter-spacing="2.2" fill="#9A9289">KV CACHE</text>
  <g>
    <rect x="820" y="536" width="6" height="44" fill="#C9C2B8"/>
    <rect x="831" y="536" width="6" height="44" fill="#C9C2B8"/>
    <rect x="842" y="536" width="6" height="44" fill="#C9C2B8"/>
