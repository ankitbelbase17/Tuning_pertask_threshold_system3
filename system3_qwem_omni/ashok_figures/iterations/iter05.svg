<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 720" width="1600" height="720" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">

  <defs>
    <marker id="aGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,1.5 L9,5 L0,8.5 z" fill="#9A9289"/>
    </marker>
    <marker id="aInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,1.5 L9,5 L0,8.5 z" fill="#2B2926"/>
    </marker>
    <marker id="aAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,1.5 L9,5 L0,8.5 z" fill="#D9902A"/>
    </marker>

    <!-- one frame of the match, in two prunable halves -->
    <g id="sky">
      <rect x="0" y="0" width="70" height="27" fill="#CBE0F0"/>
      <ellipse cx="15" cy="10" rx="8" ry="4"   fill="#FFFFFF" opacity="0.92"/>
      <ellipse cx="23" cy="12" rx="6" ry="3.2" fill="#FFFFFF" opacity="0.92"/>
      <ellipse cx="52" cy="8"  rx="7" ry="3.6" fill="#FFFFFF" opacity="0.86"/>
    </g>
    <g id="ground">
      <rect x="0" y="27" width="70" height="25" fill="#B9D9A4"/>
      <path d="M50,20 L50,34 L66,34 L66,20" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
      <circle cx="22" cy="33" r="2" fill="#2B2926"/><rect x="20.6" y="35" width="2.8" height="7" rx="1.2" fill="#2B2926"/>
      <circle cx="33" cy="31" r="2" fill="#2B2926"/><rect x="31.6" y="33" width="2.8" height="7" rx="1.2" fill="#2B2926"/>
      <circle cx="43" cy="41" r="2.2" fill="#FFFFFF" stroke="#2B2926" stroke-width="0.6"/>
    </g>
    <g id="border">
      <rect x="0" y="0" width="70" height="52" rx="3" fill="none" stroke="#7FA6C0" stroke-width="1.2"/>
    </g>
  </defs>

  <rect x="0" y="0" width="1600" height="720" fill="#FBFAF7"/>

  <!-- ============ THE REPROGRAMMABLE BOX ============ -->
  <rect x="380" y="60" width="840" height="460" rx="10" fill="#FEFDFB" stroke="#9A9289" stroke-width="1.8"/>
  <text x="404" y="96" font-size="13" letter-spacing="2.2" fill="#9A9289">STREAMING VLM</text>

  <!-- ============ TASK ============ -->
  <line x1="56" y1="72" x2="56" y2="128" stroke="#C9C2B8" stroke-width="2"/>
  <text x="70" y="90" font-size="13" letter-spacing="2.2" fill="#9A9289">TASK</text>
  <text x="70" y="120" font-size="18" fill="#2B2926">Tell me when a player scores.</text>
  <path d="M348,114 C500,108 650,112 790,120" fill="none" stroke="#9A9289" stroke-width="1.6" marker-end="url(#aGray)"/>

  <!-- ============ VIDEO STREAM : the world, unedited ============ -->
  <text x="60" y="236" font-size="13" letter-spacing="2.2" fill="#9A9289">VIDEO STREAM</text>
  <g transform="translate(-18,250)"><use xlink:href="#sky" href="#sky"/><use xlink:href="#ground" href="#ground"/><use xlink:href="#border" href="#border"/></g>
  <g transform="translate(60,250)"> <use xlink:href="#sky" href="#sky"/><use xlink:href="#ground" href="#ground"/><use xlink:href="#border" href="#border"/></g>
  <g transform="translate(138,250)"><use xlink:href="#sky" href="#sky"/><use xlink:href="#ground" href="#ground"/><use xlink:href="#border" href="#border"/></g>
  <g transform="translate(216,250)"><use xlink:href="#sky" href="#sky"/><use xlink:href="#ground" href="#ground"/><use xlink:href="#border" href="#border"/></g>
  <g transform="translate(294,250)"><use xlink:href="#sky" href="#sky"/><use xlink:href="#ground" href="#ground"/><use xlink:href="#border" href="#border"/></g>
  <text x="60" y="326" font-size="14" font-style="italic" fill="#9A9289">arrives whole, at a constant rate</text>

  <!-- ============ APERTURE ============ -->
  <rect x="371" y="244" width="16" height="96" rx="3" fill="#FBEFD8" stroke="#D9902A" stroke-width="1.8"/>

  <!-- ============ WHAT THE PLAN LET THROUGH ============ -->
  <g transform="translate(406,250)"><use xlink:href="#sky" href="#sky"/><use xlink:href="#ground" href="#ground"/><use xlink:href="#border" href="#border"/></g>
  <g transform="translate(484,250)"><use xlink:href="#sky" href="#sky" opacity="0.14"/><use xlink:href="#ground" href="#ground"/><use xlink:href="#border" href="#border"/></g>
  <g transform="translate(562,250)" opacity="0.14"><use xlink:href="#sky" href="#sky"/><use xlink:href="#ground" href="#ground"/><use xlink:href="#border" href="#border"/></g>

  <text x="441" y="320" font-size="12" letter-spacing="1" fill="#9A9289" text-anchor="middle">KEPT</text>
  <text x="519" y="320" font-size="12" letter-spacing="1" fill="#9A9289" text-anchor="middle">PRUNED</text>
  <text x="597" y="320" font-size="12" letter-spacing="1" fill="#9A9289" text-anchor="middle">DROPPED</text>

  <path d="M636,278 L652,278" fill="none" stroke="#9A9289" stroke-width="1.6" marker-end="url(#aGray)"/>

  <!-- ============ ENCODER ============ -->
  <rect x="660" y="244" width="130" height="68" rx="6" fill="#F2EFEA" stroke="#9A9289" stroke-width="1.4"/>
  <text x="719" y="284" font-size="18" fill="#2B2926" text-anchor="middle">Encoder</text>
  <g transform="translate(774,260)" stroke="#94A7B5" stroke-width="1.3" stroke-linecap="round">
    <line x1="0" y1="-7" x2="0" y2="7"/><line x1="-6.1" y1="-3.5" x2="6.1" y2="3.5"/><line x1="-6.1" y1="3.5" x2="6.1" y2="-3.5"/>
  </g>

  <!-- ============ CONFIG : sits directly above its author ============ -->
  <rect x="800" y="86" width="390" height="124" rx="8" fill="#FBEFD8" stroke="#D9902A" stroke-width="2"/>
  <text x="822" y="116" font-size="13" letter-spacing="2.2" fill="#A96C0E">CONFIG</text>
  <g font-family="'DejaVu Sans Mono', 'SF Mono', Menlo, monospace" font-size="15" fill="#4A453F">
    <text x="822" y="146">look:    penalty area</text>
    <text x="822" y="172">sample:  3 fps</text>
    <text x="822" y="198">keep:    last 30s</text>
  </g>

  <!-- taps : everything inside the box is set by the config -->
  <g stroke="#D9902A" stroke-width="1.8" fill="none" stroke-dasharray="5,4">
    <path d="M798,176 C640,192 470,216 392,242" marker-end="url(#aAmber)"/>
    <path d="M860,214 C826,226 776,236 738,240" marker-end="url(#aAmber)"/>
    <path d="M900,214 L900,392" marker-end="url(#aAmber)"/>
    <path d="M1000,214 L1000,252" marker-end="url(#aAmber)"/>
  </g>

  <!-- ============ THINKING LLM ============ -->
  <rect x="966" y="262" width="230" height="94" rx="8" fill="#FFFFFF" stroke="#B4ADA4" stroke-width="1.6"/>
  <rect x="960" y="256" width="230" height="94" rx="8" fill="#FFFFFF" stroke="#2B2926" stroke-width="2.2"/>
  <text x="1063" y="300" font-size="23" font-weight="600" fill="#2B2926" text-anchor="middle">VLM</text>
  <text x="1063" y="324" font-size="14" font-style="italic" fill="#9A9289" text-anchor="middle">thinking</text>
  <g transform="translate(1166,274)" stroke="#94A7B5" stroke-width="1.3" stroke-linecap="round">
    <line x1="0" y1="-7" x2="0" y2="7"/><line x1="-6.1" y1="-3.5" x2="6.1" y2="3.5"/><line x1="-6.1" y1="3.5" x2="6.1" y2="-3.5"/>
  </g>
  <path d="M1120,254 L1120,216" fill="none" stroke="#D9902A" stroke-width="2.6" marker-end="url(#aAmber)"/>
  <text x="1132" y="240" font-size="15" font-weight="600" fill="#A96C0E">writes</text>

  <!-- ============ KV CACHE, INSIDE THE BOX ============ -->
  <text x="640" y="386" font-size="13" letter-spacing="2.2" fill="#9A9289">KV CACHE</text>
  <g fill="#E2DCD3" stroke="#C9C2B8" stroke-width="1">
    <rect x="640" y="400" width="32" height="44" rx="2"/>
    <rect x="678" y="400" width="32" height="44" rx="2"/>
    <rect x="716" y="400" width="32" height="44" rx="2"/>
    <rect x="754" y="400" width="32" height="44" rx="2"/>
  </g>
  <g fill="#B4CFE0">
    <rect x="810" y="400" width="6" height="44"/><rect x="821" y="400" width="6" height="44"/>
    <rect x="832" y="400" width="6" height="44"/><rect x="843" y="400" width="6" height="44"/>
    <rect x="854" y="400" width="6" height="44"/><rect x="865" y="400" width="6" height="44"/>
    <rect x="876" y="400" width="6" height="44"/><rect x="887" y="400" width="6" height="44"/>
    <rect x="898" y="400" width="6" height="44"/><rect x="909" y="400" width="6" height="44"/>
    <rect x="920" y="400" width="6" height="44"/><rect x="931" y="400" width="6" height="44"/>
    <rect x="942" y="400" width="6" height="44"/><rect x="953" y="400" width="6" height="44"/>
    <rect x="964" y="400" width="6" height="44"/><rect x="975" y="400" width="6" height="44"/>
    <rect x="986" y="400" width="6" height="44"/><rect x="997" y="400" width="6" height="44"/>
    <rect x="1008" y="400" width="6" height="44"/><rect x="1019" y="400" width="6" height="44"/>
    <rect x="1030" y="400" width="6" height="44"/><rect x="1041" y="400" width="6" height="44"/>
    <rect x="1052" y="400" width="6" height="44"/><rect x="1063" y="400" width="6" height="44"/>
    <rect x="1074" y="400" width="6" height="44"/><rect x="1085" y="400" width="6" height="44"/>
    <rect x="1096" y="400" width="6" height="44"/><rect x="1107" y="400" width="6" height="44"/>
    <rect x="1118" y="400" width="6" height="44"/><rect x="1129" y="400" width="6" height="44"/>
    <rect x="1140" y="400" width="6" height="44"/><rect x="1151" y="400" width="6" height="44"/>
    <rect x="1162" y="400" width="6" height="44"/><rect x="1173" y="400" width="6" height="44"/>
  </g>
  <text x="640" y="472" font-size="14" font-style="italic" fill="#9A9289">the config decides what stays in memory</text>

  <path d="M1069,396 L1069,356" fill="none" stroke="#9A9289" stroke-width="1.6" marker-end="url(#aGray)"/>
  <text x="1082" y="380" font-size="14" fill="#9A9289">reads</text>

  <!-- ============ INGEST LLM : outside the box ============ -->
  <path d="M665,316 L665,340 L430,340 L430,552" fill="none" stroke="#9A9289" stroke-width="1.6" marker-end="url(#aGray)"/>
  <rect x="412" y="566" width="176" height="72" rx="8" fill="#FFFFFF" stroke="#B4ADA4" stroke-width="1.6"/>
  <rect x="406" y="560" width="176" height="72" rx="8" fill="#FFFFFF" stroke="#2B2926" stroke-width="2.2"/>
  <text x="478" y="592" font-size="23" font-weight="600" fill="#2B2926" text-anchor="middle">VLM</text>
  <text x="478" y="616" font-size="14" font-style="italic" fill="#9A9289" text-anchor="middle">ingest</text>
  <g transform="translate(556,578)" stroke="#94A7B5" stroke-width="1.3" stroke-linecap="round">
    <line x1="0" y1="-7" x2="0" y2="7"/><line x1="-6.1" y1="-3.5" x2="6.1" y2="3.5"/><line x1="-6.1" y1="3.5" x2="6.1" y2="-3.5"/>
  </g>
  <path d="M582,596 L616,596 L616,422 L634,422" fill="none" stroke="#9A9289" stroke-width="1.6" marker-end="url(#aGray)"/>
  <text x="406" y="660" font-size="14" font-style="italic" fill="#9A9289">outside the box — nothing here is reconfigured</text>

  <!-- ============ RESPONSE ============ -->
  <path d="M1190,300 C1216,302 1230,304 1248,306" fill="none" stroke="#2B2926" stroke-width="2" marker-end="url(#aInk)"/>
  <line x1="1264" y1="260" x2="1264" y2="316" stroke="#C9C2B8" stroke-width="2"/>
  <text x="1278" y="278" font-size="13" letter-spacing="2.2" fill="#9A9289">RESPONSE</text>
  <text x="1278" y="308" font-size="18" fill="#2B2926">0:42 — a goal was scored.</text>
  <text x="1278" y="334" font-size="14" font-style="italic" fill="#9A9289">spoken the moment it matters</text>

  <!-- ============ LEGEND ============ -->
  <g transform="translate(880,690)" stroke="#94A7B5" stroke-width="1.3" stroke-linecap="round">
    <line x1="0" y1="-7" x2="0" y2="7"/><line x1="-6.1" y1="-3.5" x2="6.1" y2="3.5"/><line x1="-6.1" y1="3.5" x2="6.1" y2="-3.5"/>
  </g>
  <text x="898" y="695" font-size="14" font-style="italic" fill="#9A9289">every component is frozen — nothing is ever trained</text>
  <text x="898" y="668" font-size="14" font-style="italic" fill="#9A9289">both VLM blocks are the same weights, running as two copies</text>

</svg>
